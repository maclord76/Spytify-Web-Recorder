<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spytify Web Recorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">●</span>
        <div>
          <h1>Spytify Web</h1>
          <p>Enregistreur MP3 autonome</p>
        </div>
        <a class="spotify-link" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" title="Ouvrir Spotify dans un nouvel onglet" aria-label="Ouvrir Spotify dans un nouvel onglet">Spotify ↗</a>
      </header>

      <label for="track-url">URL du morceau Spotify</label>
      <input
        id="track-url"
        type="url"
        spellcheck="false"
        placeholder="https://open.spotify.com/track/…"
        autocomplete="off"
      >
      <button id="open-track" class="secondary" type="button">1. Ouvrir le morceau</button>

      <div class="setting">
        <label for="bitrate">Qualité MP3</label>
        <select id="bitrate">
          <option value="128">128 kbit/s</option>
          <option value="192" selected>192 kbit/s</option>
          <option value="256">256 kbit/s</option>
          <option value="320">320 kbit/s</option>
        </select>
      </div>

      <button id="start-recording" class="primary" type="button">2. Préparer le morceau</button>
      <button id="stop-recording" class="danger" type="button" hidden>Arrêter et enregistrer le MP3</button>

      <section id="status" class="status" aria-live="polite">
        <div class="status-line">
          <span id="status-dot" class="status-dot"></span>
          <strong id="status-title">Prêt</strong>
          <time id="elapsed">00:00</time>
        </div>
        <p id="status-message">Ouvrez un morceau dans Spotify Web.</p>
        <p id="track-name" class="track-name" hidden></p>
      </section>

      <p class="hint">Démarrer lance automatiquement la lecture. La fin du lecteur ou le passage au morceau suivant arrête et télécharge le MP3.</p>
      <p id="extension-version" class="hint"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
